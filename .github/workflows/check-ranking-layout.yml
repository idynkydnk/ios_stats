name: Check iPhone standings layout
on:
  push:
    branches: [codex/iphone-layout-check]
  workflow_dispatch:
    inputs:
      large_records_only:
        description: 'Run only the three large-record scenarios'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select current Xcode
        run: |
          QA_XCODE=$(python3 - <<'PY'
          import plistlib
          from pathlib import Path
          def version(app):
              with (app / 'Contents/Info.plist').open('rb') as source:
                  return tuple(int(part) for part in plistlib.load(source)['CFBundleShortVersionString'].split('.'))
          apps = list(Path('/Applications').glob('Xcode*.app'))
          selected = max(apps, key=version)
          if version(selected) < (26,):
              raise SystemExit('The app requires Xcode 26 or newer for default MainActor isolation.')
          print(selected)
          PY
          )
          sudo xcode-select --switch "$QA_XCODE/Contents/Developer"
          xcodebuild -version
      - name: Prepare cloud simulator tests
        run: |
          brew install xcodegen
          xcodegen generate --spec tests/layout/project.yml
          xcrun simctl list devices available --json > /tmp/devices.json
          python3 - <<'PY'
          import json, os
          groups = json.load(open('/tmp/devices.json'))['devices']
          phones = [d for group in groups.values() for d in group if d['isAvailable'] and d['name'].startswith('iPhone')]
          device = next((d for d in phones if '16' in d['name'] and 'Pro' not in d['name'] and 'Plus' not in d['name']), phones[0])
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('QA_DEVICE_ID=' + device['udid'] + '\n')
          print('Cloud simulator:', device['name'])
          PY
      - name: Test actual standings at small widths and larger text sizes
        env:
          QA_LARGE_RECORDS_ONLY: ${{ inputs.large_records_only }}
        run: |
          set -o pipefail
          QA_TEST_FILTER=()
          if [[ "$QA_LARGE_RECORDS_ONLY" == "true" ]]; then
            QA_TEST_FILTER=(-only-testing:RankingLayoutUITests/RankingLayoutUITests/testLargeRecordMetrics)
          fi
          xcodebuild test -project tests/layout/RankingLayoutCheck.xcodeproj -scheme RankingLayoutCheck -destination "platform=iOS Simulator,id=$QA_DEVICE_ID" -resultBundlePath output/RankingLayout.xcresult "${QA_TEST_FILTER[@]}" CODE_SIGNING_ALLOWED=NO | tee /tmp/layout-build.log
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p output/screenshots
          xcrun xcresulttool export attachments --path output/RankingLayout.xcresult --output-path output/screenshots || true
          cp /tmp/layout-build.log output/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-layout-results
          path: output/
          retention-days: 7
